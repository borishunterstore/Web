<script>document.addEventListener('DOMContentLoaded', function() {const authData = JSON.parse(localStorage.getItem('bhstore_auth') || '{}');if (authData.username && !authData.verificationCode) {window.location.href = '/';return;}if (!authData.verificationCode) {window.location.href = '/auth.html';return;}const codeInputs = document.querySelectorAll('.code-input');const verifyBtn = document.getElementById('verifyBtn');const resendBtn = document.getElementById('resendBtn');const countdownSpan = document.getElementById('countdown');const resendTimerSpan = document.getElementById('resendTimer');const errorMessage = document.getElementById('errorMessage');const successMessage = document.getElementById('successMessage');const helpLink = document.getElementById('helpLink');let timeLeft = 600;let resendTimeLeft = 60;let countdownInterval = null;let resendInterval = null;function startCountdown() {if (countdownInterval) clearInterval(countdownInterval);countdownInterval = setInterval(() => {if (timeLeft <= 0) {clearInterval(countdownInterval);countdownSpan.textContent = '00:00';verifyBtn.disabled = true;showError('Время истекло');return;}const minutes = Math.floor(timeLeft / 60);const seconds = timeLeft % 60;countdownSpan.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;timeLeft--;}, 1000);}function startResendTimer() {if (resendInterval) clearInterval(resendInterval);resendBtn.disabled = true;resendTimeLeft = 60;resendInterval = setInterval(() => {if (resendTimeLeft <= 0) {clearInterval(resendInterval);resendBtn.disabled = false;resendBtn.innerHTML = '<i class="fas fa-redo"></i> Отправить код повторно';return;}resendTimerSpan.textContent = resendTimeLeft;resendTimeLeft--;}, 1000);}startCountdown();startResendTimer();codeInputs.forEach((input, index) => {input.addEventListener('input', function(e) {const value = e.target.value;if (value && !/^\d$/.test(value)) {e.target.value = '';return;}if (value) {e.target.classList.add('filled tTimeout(() => {window.location.href = '/';}, 2000);} else {throw new Error(result.error || 'Ошибка регистрации');}} catch (error) {console.error('Verification error:', error);showError(error.message || 'Неверный код верификации');codeInputs.forEach(input => {input.value = '';input.classList.remove('filled');});if (codeInputs[0]) codeInputs[0].focus();verifyBtn.innerHTML = originalText;verifyBtn.disabled = false;}});resendBtn.addEventListener('click', async function() {resendBtn.disabled = true;resendBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Отправка...';try {const newCode = Math.floor(100000 + Math.random() * 900000).toString();const response = await fetch('/api/send-verification', {method: 'POST',headers: { 'Content-Type': 'application/json' },body: JSON.stringify({userId: authData.id,code: newCode})});const result = await response.json();if (result.success) {authData.verificationCode = newCode;localStorage.setItem('bhstore_auth', JSON.stringify(authData));showSuccess('Код отправлен');timeLeft = 600;resendTimeLeft = 60;startCountdown();startResendTimer();codeInputs.forEach(input => {input.value = '';input.classList.remove('filled');});if (codeInputs[0]) codeInputs[0].focus();} else {throw new Error(result.error || 'Ошибка отправки кода');}} catch (error) {console.error('Resend error:', error);showError('Ошибка отправки кода: ' + error.message);resendBtn.disabled = false;resendBtn.innerHTML = '<i class="fas fa-redo"></i> Отправить код повторно';}});helpLink.addEventListener('click', function(e) {e.preventDefault();showError('Если вы не получили код:<br>1. Убедитесь что у вас открыты личные сообщения<br>2. Проверьте папку "Запросы сообщений"<br>3. Напишите в поддержку @borisonchikofficial');});if (codeInputs[0]) {setTimeout(() => codeInputs[0].focus(), 100);}});</script><script src="js/api.js"></script><script src="js/auth.js"></script><script src="js/promocode.js"></script><script src="js/payment.js"></script><script src="js/chat.js"></script><script
