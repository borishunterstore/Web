    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">

<button id="telegramAuthBtn" class="btn-auth btn-telegram-auth">

            </div>

                        <button class="consent-btn" data-doc="terms"><i class="fas fa-file-contract"></i> Пользовательское соглашение</button>
                        <a href="/legal?terms" target="_blank" class="doc-link"><i class="fas fa-external-link-alt"></i></a>
                    </div>

                        <div class="consent-status"><i class="fas fa-circle pending"></i></div>

            </div>

                <i class="fas fa-shield-alt"></i>
                <div><strong>Безопасность:</strong> Мы не получаем доступ к вашим паролям. Авторизация происходит через официальные API.</div>
            </div>

            <div class="auth-footer">
                <p>Нажимая кнопку авторизации, вы принимаете <a href="/legal">условия использования</a></p>

    <script>
const urlParams = new URLSearchParams(window.location.search);
const telegramCode = urlParams.get('code');
const telegramId = urlParams.get('telegram_id');

if (telegramCode && telegramId) {
    // Автоматическая авторизация через Telegram
    fetch('/api/auth/telegram/deep', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ code: telegramCode, telegram_id: telegramId })
    }).then(r => r.json()).then(data => {
        if (data.success) {
            localStorage.setItem('bhstore_auth', JSON.stringify({
                id: data.user.id,
                username: data.user.username,
                email: data.user.email,
                token: data.token,
                authMethod: 'telegram'
            }));
            window.location.href = '/profile.html';
        } else {
            alert('Ошибка авторизации: ' + data.error);
        }
    });
}


        (function() {
            const STORAGE_KEYS = {
                offer: 'legal_consent_offer',
                terms: 'legal_consent_terms',
                privacy: 'legal_consent_privacy'
            };
            
            const discordBtn = document.getElementById('discordAuthBtn');
            const telegramBtn = document.getElementById('telegramAuthBtn');
            const consentBtns = document.querySelectorAll('.consent-btn');
            const warningMessage = document.getElementById('warningMessage');
            const completedSpan = document.getElementById('completedCount');
            
            function checkAllConsents() {
                return localStorage.getItem(STORAGE_KEYS.offer) === 'true' &&
                       localStorage.getItem(STORAGE_KEYS.terms) === 'true' &&
                       localStorage.getItem(STORAGE_KEYS.privacy) === 'true';
            }
            
            function getCompletedCount() {
                return Object.values(STORAGE_KEYS).filter(key => localStorage.getItem(key) === 'true').length;
            }
            
            function updateUI() {
                if (completedSpan) completedSpan.textContent = getCompletedCount();
                
                Object.keys(STORAGE_KEYS).forEach(doc => {
                    const isCompleted = localStorage.getItem(STORAGE_KEYS[doc]) === 'true';
                    const item = document.querySelector(`.consent-item[data-doc="${doc}"]`);
                    const btn = item?.querySelector('.consent-btn');
                    const statusIcon = item?.querySelector('.consent-status i');
                    
                    if (item) {
                        if (isCompleted) {
                            item.classList.add('completed');
                            if (btn) btn.innerHTML = `<i class="fas fa-check-circle"></i> Ознакомлен(а)`;
                            if (statusIcon) statusIcon.className = 'fas fa-check-circle completed';
                        } else {
                            item.classList.remove('completed');
                            if (btn) {
                                const texts = { offer: 'Оферта', terms: 'Пользовательское соглашение', privacy: 'Политика конфиденциальности' };
                                btn.innerHTML = `<i class="fas ${doc === 'offer' ? 'fa-file-signature' : doc === 'terms' ? 'fa-file-contract' : 'fa-shield-alt'}"></i> ${texts[doc]}`;
                            }
                            if (statusIcon) statusIcon.className = 'fas fa-circle pending';
                        }
                    }
                });
                
                if (warningMessage) warningMessage.classList.toggle('show', !checkAllConsents());
            }
            
            consentBtns.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.preventDefault();
                    const docType = btn.getAttribute('data-doc');
                    if (docType && localStorage.getItem(STORAGE_KEYS[docType]) !== 'true') {
                        localStorage.setItem(STORAGE_KEYS[docType], 'true');
                        updateUI();
                    }
                });
            });
            
            // DISCORD
            function startDiscordAuth() {
                if (!checkAllConsents()) {
                    warningMessage.classList.add('show');
                    return;
                }
                const clientId = '1328718434967486575';
                const redirectUri = 'https://bhstore.netlify.app/auth/discord/callback';
                const state = Math.random().toString(36).substring(2, 15);
                localStorage.setItem('discord_oauth_state', state);
                const authUrl = `https://discord.com/api/oauth2/authorize?client_id=${clientId}&redirect_uri=${encodeURIComponent(redirectUri)}&response_type=code&scope=identify email&state=${state}&prompt=consent`;
                window.open(authUrl, 'Discord Auth', 'width=500,height=600,menubar=no,toolbar=no,location=no,status=no');
            }
            
            // TELEGRAM
            function showTelegramModal() {
                if (!checkAllConsents()) {
                    warningMessage.classList.add('show');
                    return;
                }
                if (window.telegramAuth && typeof window.telegramAuth.showModal === 'function') {
                    window.telegramAuth.showModal();
                } else {
                    alert('Telegram авторизация временно недоступна. Обновите страницу.');
                }
            }
            
            if (discordBtn) discordBtn.addEventListener('click', startDiscordAuth);
            if (telegramBtn) telegramBtn.addEventListener('click', showTelegramModal);
            
            // DISCORD CALLBACK
            window.addEventListener('message', async (event) => {
                if (event.data?.type === 'DISCORD_AUTH_CALLBACK') {
                    if (!checkAllConsents()) {
                        alert('Ознакомьтесь со всеми документами');
                        return;
                    }
                    const savedState = localStorage.getItem('discord_oauth_state');
                    if (savedState !== event.data.state) {
                        alert('Ошибка безопасности');
                        return;
                    }
                    localStorage.removeItem('discord_oauth_state');
                    
                    const code = event.data.code;
                    if (!code) {
                        alert('Код не получен');
                        return;
                    }
                    
                    discordBtn.disabled = true;
                    telegramBtn.disabled = true;
                    
                    try {
                        const response = await fetch('/api/auth/discord', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ code })
                        });
                        const data = await response.json();
                        
                        if (data.success && data.user) {
                            const verificationCode = Math.floor(100000 + Math.random() * 900000).toString();
                            const sendResponse = await fetch('/api/send-verification', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ userId: data.user.id, code: verificationCode })
                            });
                            const sendResult = await sendResponse.json();
                            
                            if (sendResult.success) {
                                localStorage.setItem('bhstore_auth', JSON.stringify({
                                    ...data.user,
                                    verificationCode,
                                    token: data.token
                                }));
                                window.location.href = '/verify.html';
                            } else {
                                throw new Error('Ошибка отправки кода');
                            }
                        } else {
                            throw new Error(data.error || 'Ошибка авторизации');
                        }
                    } catch (error) {
                        alert('Ошибка: ' + error.message);
                        discordBtn.disabled = false;
                        telegramBtn.disabled = false;
                    }
                }
            });
            
            // Проверка уже авторизованного
            const authData = JSON.parse(localStorage.getItem('bhstore_auth') || '{}');
            if (authData.username && !authData.verificationCode) {
                window.location.href = '/';
            }
            
            updateUI();
        })();
    </script>
