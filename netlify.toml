[build]
  command = "npm ci --production"
  functions = "netlify/functions"
  publish = "."

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/server/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/auth/discord/callback"
  to = "/.netlify/functions/server/auth/discord/callback"
  status = 200
  force = true

[[redirects]]
  from = "/auth/telegram/callback"
  to = "/.netlify/functions/telegram-callback"
  status = 200
  force = true