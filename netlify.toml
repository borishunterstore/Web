[build]
  command = "npm ci --production"
  functions = "netlify/functions"
  publish = "."

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["express", "axios", "cors", "serverless-http", "@neondatabase/serverless", "dotenv", "jsonwebtoken", "helmet", "express-rate-limit"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/server/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/auth/discord/callback"
  to = "/.netlify/functions/server/auth/discord/callback"
  status = 200
  force = true

[[redirects]]
  from = "/auth/telegram/callback"
  to = "/.netlify/functions/server/auth/telegram/callback"
  status = 200
  force = true