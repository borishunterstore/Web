[build]
  command = "npm run build"
  publish = "."

[build.environment]
  NODE_VERSION = "20"

# Отключаем все расширения
[plugins]
  # Не устанавливаем никакие плагины

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/server/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/auth/discord/callback"
  to = "/.netlify/functions/server/auth/discord/callback"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 404